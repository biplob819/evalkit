# The cross-project eval index (B5.5, docs/index.md): what each project's row shows.
# The index never picks a headline: a project without `headline` shows "not designated", and so
# does a model's quality cell without `quality`. Every headline below is the one the project's
# own session confirmed on 2026-11-18 (file, selector and label as it sent them).
# Selectors name a metric row exactly (every label; "*" matches any value), or, for a project's
# own summary format (`own_format`), a path (docs/index.md, "The path selector"). Paths are in
# each project's own repository and are fetched by `evalkit index snapshot` at one commit.
schema_version: index-config-1
heldout_splits: [heldout]
projects:
  evalkit:
    # the README headline: the most grounded model, by the cross-family judge
    headline:
      metric: headline
      labels: {model: gpt-6.1-sol, judge: claude-opus-5-5}
      label: Correct and fully grounded (PubMedQA)
    quality: {metric: accuracy}
    lessons: docs/lessons.md
  course-assistant:
    # confirmed by its own session on 2026-11-20 (main 6488adf): the release gate's aggregates on
    # heldout-4 (OWNER D-90), not tests/eval/evalreg/summary.json (a 16-case regression fixture)
    # and not that run's EvalKit summary headline. Single judge (its D-80). An own-format file has
    # no quality rows, so its quality words are the comparison row's caption.
    summary: docs/measurements/e2.5-heldout4-gates.json
    own_format: {run_id: $.run, run_at: $.finished_at}
    headline:
      path: '$.gates[?name == "grounded"].value'
      unit: ratio
      decimals: 3
      direction: higher
      label: Grounded answer rate, held-out (heldout-4, 215 cases, scored once)
      caption: >-
        66/75; target ≥ 0.90, lower bound 0.80; below target, shipped as a documented limit
        (D-90). One OpenAI judge (gpt-6.1-sol) grades; calibration is against a model panel, not
        a person (D-79, D-80)
    comparison:
      path: '$.gates[?target == "all pass (zero tolerance)"].value'
      per: name
      unit: ratio
      decimals: 3
      label: Zero-tolerance gates on held-out
      caption: >-
        integrity 56/56, injection 44/44, leak 49/49, identity 5/5; latency p95 11.03 s against
        11 s. Every safety gate passes; grounding and latency miss their targets and v0.1.0 ships
        with both stated as known limits
    lessons: docs/lessons.md
  gemma-grounded-health:
    # confirmed: the fine-tuned v1 model by the cross-family judge (a v2 selector follows later);
    # quality per model not confirmed: not designated
    headline:
      metric: headline
      labels: {model: gemma-e2b-grounded-q4, judge: claude-opus-5-5}
      label: Correct and fully grounded (fine-tuned v1)
    lessons: docs/lessons.md
  assay-pipeline:
    # the published run changes with each release: docs/results/LATEST names the current bundle
    # and metrics.json sits beside it. Quality: the model its owner named (confirmed later on
    # 2026-11-18); the other model's quality cell is not designated.
    pointer: {path: docs/results/LATEST, file: metrics.json}
    headline:
      metric: scripted_attacker_stopped
      label: Attacks stopped with no model in the loop
    quality:
      metric: normal_answer_correct_rate
      labels: {model: claude-sonnet-5-5, split: public}
      caption: strict query match; the answers state the gold value 100% of the time
    calibration: {metric: judge_hand_label_agreement, labels: {judge: claude-opus-5-5}}
    efficiency_labels: {mode: live}
    gates: gates.yaml
    lessons: docs/lessons.md
    kinds: {attack_successes: guardrail, attack_trial_success_rate: guardrail}
  respectful-offers:
    # the two-arm row its release gate tests (paired block bootstrap, Holm); simulated outcomes
    headline:
      metric: diff.incremental_retained_per_1000_ntd
      labels: {a: bandit, b: rule_following_baseline, variant: central}
      label: Extra members kept per 1,000 NTD, bandit vs rule-following baseline (central, simulated)
      decimals: 3
    gates: configs/gates.yaml
    lessons: docs/lessons.md
  agentic-analytics:
    # its own summary.json (not metrics-1): tolerant headline accuracy per backend (its OWNER
    # D-81) on the rows with no fixes, the strict pre-registered score beside it
    summary: docs/results/summary.json
    own_format: {run_id: $.run_id, run_at: $.finished_at}
    headline:
      path: "$.backends[?fixes == []].accuracy"
      per: backend
      unit: rate
      ci_method: two-level bootstrap
      label: agentic-analytics — text-to-SQL accuracy (headline, strict beside)
      companion:
        path: "$.backends[?fixes == []].accuracy_strict"
        per: backend
        unit: rate
        ci_method: two-level bootstrap
        label: strict
    lessons: docs/lessons.md
  ai-visibility:
    # its own study summary: the presence share of nhs.uk for GPT-6.1 Sol, run 1, all intents
    # (its own threshold selector share:presence:nhs.uk:gpt-6.1-sol:run-1:all)
    summary: studies/uk-health/results/summary.json
    own_format: {run_at: $.generated_at}
    headline:
      path: '$.share[?kind == "presence" && publisher == "nhs.uk" && model == "gpt-6.1-sol" && run == 1 && intent == null].share'
      unit: rate
      label: Answers citing nhs.uk, GPT-6.1 Sol (run 1)
    comparison:
      path: '$.share[?kind == "presence" && publisher == "nhs.uk" && model == "claude-sonnet-5-5" && run == 1 && intent == null].share'
      unit: rate
      label: same selector, model claude-sonnet-5-5
    lessons: docs/lessons.md
  fraud-review-bedrock:
    # its second, fresh eval (500 alerts); the first eval stays a failed run in its
    # docs/measurements/eval-runs.jsonl and is not the headline. Lower is better (its D-10).
    summary: docs/measurements/summary-eval2.json
    own_format:
      run_id: $.run_id
      run_at: $.finished_at
      simulated: {path: $.data_label, equals: simulated}
    headline:
      path: $.leakage
      unit: rate
      direction: lower
      ci_method: exact 95% upper bound
      label: Fraud leakage (frauds auto-cleared, lower is better)
    lessons: docs/lessons.md
