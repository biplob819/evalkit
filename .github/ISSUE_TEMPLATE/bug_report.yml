name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Never paste API keys, `.env` contents or private data.**
        Security problems go to private vulnerability reporting (see SECURITY.md), not here.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The command you ran and a minimal task or config, if relevant.
      render: shell
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `evalkit doctor --offline --json`
      description: It shows versions and which keys are set (names only, never values).
      render: json
  - type: input
    id: version
    attributes:
      label: EvalKit version (`evalkit --version`)
    validations:
      required: true
