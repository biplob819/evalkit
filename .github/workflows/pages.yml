name: pages

# Deploy the published headline run (docs/results/) to GitHub Pages (OWNER D-47), and the
# cross-project eval index (docs/index/, B5.5) at /index/ when it has been built.
on:
  push:
    branches: [main]
    paths: ["docs/results/**", "docs/index/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp docs/results/report.html _site/index.html
          cp docs/results/summary.json docs/results/charts.vl.json _site/
          # the cross-project eval index (B5.5), once `evalkit index build` has written it
          if [ -f docs/index/index.html ]; then
            mkdir -p _site/index
            cp docs/index/index.html docs/index/index.json _site/index/
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
