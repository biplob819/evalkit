id: an-01
source_project: evalkit
goal: What was the total net revenue (after line-item discounts, before returns) from
  completed orders in 2025?
allowed_tools:
- list_tables
- describe_table
- run_sql
- final_answer
step_budget: 12
gold_outcome:
  kind: result_set
  columns:
  - net_revenue
  rows:
  - - 508083.95
  ordered: false
simulated_user_intent: null
split: public
gold_sql: SELECT ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)), 2) AS
  net_revenue FROM orders o JOIN order_items oi USING (order_id) WHERE o.status =
  'completed' AND year(o.order_date) = 2025
