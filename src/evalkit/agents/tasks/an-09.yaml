simulated_user_intent: I mean the top 5 customers by net revenue (after line-item
  discounts, before returns) from completed orders in 2025, highest first. Show each
  customer's id, name and that revenue (names are not unique).
split: public
gold_sql: SELECT c.customer_id, c.name, ROUND(SUM(oi.quantity * oi.unit_price * (1
  - oi.discount)), 2) AS net_revenue FROM orders o JOIN order_items oi USING (order_id)
  JOIN customers c USING (customer_id) WHERE o.status = 'completed' AND year(o.order_date)
  = 2025 GROUP BY c.customer_id, c.name ORDER BY net_revenue DESC, c.customer_id LIMIT
  5
