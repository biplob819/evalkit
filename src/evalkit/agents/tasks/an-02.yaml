id: an-02
source_project: evalkit
goal: Show net revenue (after line-item discounts, before returns) from completed
  orders by store region for 2024, highest first.
allowed_tools:
- list_tables
- describe_table
- run_sql
- final_answer
step_budget: 12
gold_outcome:
  kind: result_set
  columns:
  - region
  - net_revenue
  rows:
  - - West
    - 83446.78
  - - South
    - 79355.7
  - - North
    - 72790.0
  ordered: true
simulated_user_intent: null
split: public
gold_sql: SELECT s.region, ROUND(SUM(oi.quantity * oi.unit_price * (1 - oi.discount)),
  2) AS net_revenue FROM orders o JOIN order_items oi USING (order_id) JOIN stores
  s USING (store_id) WHERE o.status = 'completed' AND year(o.order_date) = 2024 GROUP
  BY s.region ORDER BY net_revenue DESC
