# Scope for the portfolio page's "built, cut and later" toggle.
# Every item comes from the PRD, the decision log (docs/decisions.md), the changelog or the
# README; `source` names where. Plain words in item and why; codes only in source.
# tests/test_portfolio.py checks the shape, the counts and that every source exists.

priorities:
  - item: One command compares models on answers that are correct and grounded in the source
    call: built
    why: The headline counts an answer only when it is right and every claim is backed by its cited sentences, with 95% intervals.
    source: "EvalKit PRD.md (US1); README.md"
  - item: Two judges from different model families rule on every claim
    call: built
    why: A judge can favour its own family, and that only shows when both judge every answer.
    source: D-4
  - item: Judges checked against held-out reference labels, with a weak judge flagged
    call: built
    why: Agreement measured on the labels used to tune the rubric would be training accuracy, so only the held-out half counts.
    source: "D-5; D-80"
  - item: A cost quote before any spend and a hard cap during the run
    call: built
    why: Open-source users must never get a surprise bill, so the cap is checked before every call.
    source: "EvalKit PRD.md (US13); docs/cost.md"
  - item: Release gates and run comparisons with confidence intervals
    call: built
    why: A model or prompt change that breaks the bar should fail the build, not slip through on noise.
    source: "README.md; docs/gates.md"
  - item: A public demo that replays saved answers and caps live spending
    call: built
    why: Anyone can judge the work without installing anything, and a shared link cannot drain the budget or store questions.
    source: D-54
  - item: Shared scorers on PyPI, tested against the projects that use them before each release
    call: built
    why: Each project reuses one tested implementation, and a canary stops a release that would break one of them.
    source: "D-61; D-75; docs/downstream.md"
  - item: Mapping each claim to its own citation
    call: cut
    why: The mapping was a guess that marked supported claims as unsupported, so claims are now judged against every sentence the answer cited.
    source: D-52
  - item: Reading numbers out of free prose in the value check
    call: cut
    why: Every attempt to read more prose let false claims pass, so the check verifies only plain "field is value" statements.
    source: "D-74; D-77"
  - item: Giving models the paper's own conclusion during the benchmark
    call: cut
    why: It would leak the answer, so it is dropped when the data loads.
    source: "D-31; DATA_CARD.md"
  - item: Features that only one project needs
    call: cut
    why: A capability with one user and no likely second stays in that project, keeping the shared library small.
    source: D-63
  - item: A blind relabel of 20 answers to measure how consistent the labeller is
    call: later
    why: The judges' agreement is published now, and the relabel adds how far the labels agree with themselves.
    source: "D-80; D-81"
  - item: Gemini models alongside Claude and OpenAI
    call: later
    why: The adapter interface makes it a small, separate addition once the two current families are settled.
    source: "EvalKit PRD.md (Risks and open questions)"
  - item: A coverage score based on recall of key points
    call: later
    why: The current coverage score needs no extra reference, and key-point recall can be added as a second version.
    source: D-31
