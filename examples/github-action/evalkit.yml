# Run an EvalKit task in CI and fail the job when a model misses a threshold.
#
# Copy to .github/workflows/evalkit.yml in your repository. It expects evalkit.yaml and
# tasks/my_task.yaml (from `evalkit init`), and two repository secrets:
# ANTHROPIC_API_KEY and OPENAI_API_KEY (Settings > Secrets and variables > Actions).
#
# Exit codes (docs/cost.md): 0 every threshold passed, 1 a threshold failed (the job fails),
# 2 configuration error, 3 stopped at the cost cap, 4 judging still pending. Codes 3 and 4
# fail the job too: rerun it to resume from the cache at no extra cost.
name: evalkit

on:
  pull_request:
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Restore the EvalKit cache (reruns are free)
        uses: actions/cache@v4
        with:
          path: .evalkit/store
          key: evalkit-${{ hashFiles('evalkit.yaml', 'tasks/**') }}
          restore-keys: evalkit-
      - name: Install EvalKit
        run: uv tool install 'evalkit-harness[anthropic,openai]'
      - name: Estimate
        run: evalkit run evalkit.yaml --task tasks/my_task.yaml --n 50 --dry-run
      - name: Evaluate (fails the job when a threshold fails)
        run: evalkit run evalkit.yaml --task tasks/my_task.yaml --n 50 --wait 45 --out runs
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evalkit-report
          path: runs/
          if-no-files-found: ignore
